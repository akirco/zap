[package]
name = "zap"
version = "0.1.0"
edition = "2024"
description = "A file manager for the terminal, written in Rust."

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
eyre = { version = "0.6.14", default-features = false, features = ["auto-install"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
home = "0.5.12"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "process", "rt", "sync"] }
toml = "1.1.8"

[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1
